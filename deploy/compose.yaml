# 데모 한 벌 (A-09). `run_demo.ps1` 의 컨테이너판.
#
#   docker compose -f deploy/compose.yaml up --build
#
# 게임서버 대역 → NPC 서버 → Prometheus → Grafana.
# <b>대역은 우리가 만드는 게임서버가 아니다</b> — 상대방 역할을 하는 우리 쪽 가짜다 (CLAUDE.md §2.2).
#
# dotLLM 은 여기 없다. GPLv3 경계라 별도 배포이고(CLAUDE.md §2.7), 이 데모는 --tier none 으로 돈다.
# 로컬 추론과 GPU 메트릭을 붙이려면 `--profile local` 로 올린다 (C-08):
#
#   docker compose -f deploy/compose.yaml --profile local up
#
# 그 프로필의 두 서비스는 이 저장소가 만들지 않는 이미지를 쓴다 — dotLLM 은 GPLv3 라
# 우리가 굽지 않고, dcgm-exporter 는 NVIDIA 가 배포한다. 이미지 태그는 배포 담당이 채운다.

name: npc-server

services:
  gameserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.testgameserver
    command:
      - --npcs
      - "500"
      - --link-port
      - "7010"
      - --time-scale
      - "60"
    ports:
      - "7010:7010"
      - "7020:7020"
    networks: [npc]

  npc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${NPC_VERSION:-1.0.0}
        REVISION: ${NPC_REVISION:-dev}
    depends_on: [gameserver]
    environment:
      # 설정은 환경변수로 준다 (A-04). 옵션 이름에서 도출한다: --gs-host 는 NPC_GS_HOST.
      NPC_PROFILE: service
      NPC_LINK: tcp
      NPC_GS_HOST: gameserver
      NPC_GS_PORT: "7010"
      NPC_NPCS: "500"
      NPC_TIME_SCALE: "60"
      NPC_BIND: 0.0.0.0
      NPC_HEALTH_PORT: "5081"
      NPC_SNAPSHOT_DIR: /opt/npc/state
      NPC_SNAPSHOT_INTERVAL_S: "60"
      # 0.0.0.0 바인드는 관리 토큰이 있을 때만 열린다 (A-04).
      NPC_ADMIN_TOKEN: ${NPC_ADMIN_TOKEN:-demo-token-change-me}
      NPC_HEALTH_PORT_FOR_HEALTHCHECK: "5081"
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - planstore:/opt/npc/planstore/plans
      - state:/opt/npc/state
    networks: [npc]
    # SIGTERM 으로 종료 시퀀스를 돈다 (A-02). 예산 15초에 맞춰 여유를 준다.
    stop_grace_period: 30s

  # ── 로컬 추론 사이드카 (C-08) ─────────────────────────────────
  #
  # 이미지를 우리가 굽지 않는다. dotLLM 은 GPLv3 이고 별도 프로세스 + HTTP 경계로만
  # 쓴다 (CLAUDE.md §2.7). 여기 있는 것은 "붙이려면 이 모양" 이라는 자리표시다.
  #
  # NPC 서버는 이 프로세스를 되살리지 않는다 — 그것은 오케스트레이터의 일이고
  # (restart: unless-stopped), NPC 서버가 하는 일은 30초 주기로 죽었는지 보고
  # T1 요청을 T2 로 우회시키는 것뿐이다 (LocalEngineProbe).
  dotllm:
    profiles: [local]
    image: ${DOTLLM_IMAGE:-dotllm/server:latest}
    restart: unless-stopped
    environment:
      # 모델 파일은 볼륨으로 마운트한다. 이미지에 굽지 않는다 — 모델 약관이 재배포를 막는다
      # (docs/legal/models.md).
      DOTLLM_MODEL: /models/${DOTLLM_MODEL_FILE:-model.gguf}
    volumes:
      - ${DOTLLM_MODEL_DIR:-../models}:/models:ro
    ports:
      - "8080:8080"
    networks: [npc]
    healthcheck:
      # NPC 서버의 LocalEngineProbe 와 같은 것을 본다 — 두 곳이 다른 것을 보면
      # "컨테이너는 건강한데 T1 이 죽어 있다" 가 생긴다.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3

  # GPU 메트릭 (C-08 · reference_metrics §14 의 미측정 항목). nvidia-smi 를 우리가 폴링하지
  # 않는다 — 컨테이너 안에서 드라이버를 보려면 런타임 설정이 필요하고 그것은 exporter 의 일이다.
  dcgm-exporter:
    profiles: [local]
    image: ${DCGM_IMAGE:-nvidia/dcgm-exporter:latest}
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks: [npc]
    # GPU 를 넘기려면 호스트에 nvidia-container-toolkit 이 있어야 한다.
    # 없으면 이 서비스만 안 뜨고 나머지는 그대로 돈다.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [npc]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [npc]

networks:
  npc:

volumes:
  planstore:
  state:
