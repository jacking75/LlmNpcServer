# 시크릿 예시 (A-09). <b>이 파일을 그대로 쓰지 않는다</b> — 값은 배포 시스템이 주입한다.
#
#   kubectl create secret generic npc-server-secrets \
#     --from-literal=admin-token="$(openssl rand -hex 32)" \
#     --from-literal=link-secret="$(openssl rand -hex 32)"
#
# 회전 절차는 G-04 의 시크릿 항목에 있다.
apiVersion: v1
kind: Secret
metadata:
  name: npc-server-secrets
type: Opaque
stringData:
  admin-token: "REPLACE_ME"
  link-secret: "REPLACE_ME"
