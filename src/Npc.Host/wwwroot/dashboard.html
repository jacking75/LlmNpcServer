<!DOCTYPE html>
<!--
  NPC 서버 대시보드 1차. docs/11 §10.

  단일 HTML 이다. 외부 스크립트도 폰트도 CDN 도 없다 — 이 서버는 인터넷이 없는
  사내망에서도 뜬다. /metrics 를 1초마다 폴링해 5패널을 갱신한다.

  W7 이후 캐시 히트율, W9 이후 토큰/비용 패널이 붙는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Npc.Host — 대시보드</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e26; --line: #2a2f3a;
    --fg: #e6e8ee; --dim: #8b93a7; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", "D2Coding", Consolas, monospace;
  }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #clock { color: var(--dim); }
  #state { margin-left: auto; color: var(--dim); }
  #state.live { color: var(--ok); }
  #state.dead { color: var(--bad); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  h2 { font-size: 12px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; vertical-align: baseline; }
  td.k { color: var(--dim); white-space: nowrap; padding-right: 12px; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 14px; background: #232733; border-radius: 3px; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: #3b82f6; }
  .bar > span { position: relative; padding-left: 6px; font-size: 11px; line-height: 14px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  h3 { font-size: 11px; margin: 12px 0 6px; color: var(--dim); font-weight: 400; }
  .spark {
    height: 44px; margin-bottom: 8px; background: #232733; border-radius: 3px;
    display: flex; align-items: flex-end; gap: 1px; overflow: hidden; padding: 2px;
  }
  .spark > i { flex: 1 1 0; min-width: 1px; border-radius: 1px; }
</style>
</head>
<body>
<header>
  <h1>Npc.Host</h1>
  <span id="clock">—</span>
  <span id="state">연결 중…</span>
</header>

<div class="grid">
  <section><h2>틱</h2><table id="p-tick"></table></section>
  <section><h2>NPC</h2><table id="p-npc"></table></section>
  <section><h2>액션 Top 10</h2><table id="p-action"></table></section>
  <section><h2>링크</h2><table id="p-link"></table></section>
  <section>
    <h2>재계획</h2>
    <table id="p-replan"></table>
    <h3>티어별 처리율</h3>
    <table id="p-replan-tier"></table>
    <h3>점수 분포</h3>
    <table id="p-replan-histogram"></table>
  </section>
  <section>
    <h2>비용 · 티어</h2>
    <table id="p-cost"></table>
  </section>
  <section>
    <h2>플랜 캐시</h2>
    <div id="p-cache-spark" class="spark"></div>
    <table id="p-cache"></table>
    <h3>아키타입별 히트율 (하위 10)</h3>
    <table id="p-cache-archetype"></table>
  </section>
</div>

<script>
"use strict";

const POLL_MS = 1000;
const TICK_BUDGET_MS = 20;   // docs/11 §5
const SCAN_BUDGET = 150;     // docs/11 §9
const LOD_NAMES = ["0 근접", "1 근거리", "2 원거리", "3 비활성"];
const STEP_STATUS = ["Unspawned", "Ready", "Waiting", "Completed", "Failed", "Done", "?", "?"];

const $ = (id) => document.getElementById(id);

function rows(table, items) {
  table.replaceChildren(...items.map(([k, v, cls]) => {
    const tr = document.createElement("tr");
    const tdK = document.createElement("td");
    tdK.className = "k";
    tdK.textContent = k;
    const tdV = document.createElement("td");
    tdV.className = "v" + (cls ? " " + cls : "");
    if (v instanceof Node) { tdV.replaceChildren(v); } else { tdV.textContent = v; }
    tr.append(tdK, tdV);
    return tr;
  }));
}

function bar(value, total, label) {
  const wrap = document.createElement("div");
  wrap.className = "bar";
  const fill = document.createElement("i");
  fill.style.width = (total > 0 ? (100 * value / total) : 0).toFixed(1) + "%";
  const text = document.createElement("span");
  text.textContent = label;
  wrap.append(fill, text);
  return wrap;
}

function grade(value, budget) {
  if (value > budget) { return "bad"; }
  if (value > budget * 0.75) { return "warn"; }
  return "ok";
}

// 하한을 넘겨야 좋은 지표용 (히트율 등). grade 와 부호가 반대다.
function gradeAtLeast(value, floor) {
  if (value >= floor) { return "ok"; }
  if (value >= floor * 0.9) { return "warn"; }
  return "bad";
}

const SPARK_LEN = 120;   // 1초 폴링 × 120 = 2분 창
const series = {};

// 시계열 스파크라인. 서버는 스냅샷만 주므로 창은 클라이언트가 들고 있는다 —
// 새로고침하면 지워지는 것이 맞다. 지속 보관은 OpenTelemetry 수집기의 일이다.
//
// SVG 가 아니라 div 막대다. createElementNS 는 SVG 네임스페이스를 URL 문자열로 요구하는데,
// 이 파일은 URL 이 하나도 없어야 한다 (Dashboard_IsSelfContained).
// 규칙에 예외를 내느니 그리는 방법을 바꾼다 — 어차피 값 하나짜리 시계열이다.
function spark(id, value, floor) {
  const box = $(id);
  if (!box) { return; }

  const buf = series[id] ??= [];
  buf.push(value);
  if (buf.length > SPARK_LEN) { buf.shift(); }

  box.replaceChildren(...buf.map((v) => {
    const col = document.createElement("i");
    col.style.height = (100 * Math.max(0, Math.min(1, v))).toFixed(1) + "%";
    col.style.background = (floor === undefined || v >= floor) ? "#4ade80" : "#f87171";
    return col;
  }));

  box.title = `최근 ${buf.length}회 · 현재 ${(100 * value).toFixed(2)} %`
    + (floor === undefined ? "" : ` · 하한 ${(100 * floor).toFixed(0)} %`);
}

function render(m) {
  const t = m.tick, n = m.npc, l = m.link, r = m.replan;

  $("clock").textContent =
    `게임 ${t.gameDay}일 ${String(t.gameHour).padStart(2, "0")}시 · ${t.timeOfDay} · tick ${t.ticks}`;

  rows($("p-tick"), [
    ["p50", t.p50Ms.toFixed(3) + " ms", grade(t.p50Ms, 8)],
    ["p99", t.p99Ms.toFixed(3) + " ms", grade(t.p99Ms, TICK_BUDGET_MS)],
    ["max", t.maxMs.toFixed(3) + " ms", grade(t.maxMs, TICK_BUDGET_MS)],
    ["오버런", t.overruns, t.overruns > 0 ? "bad" : "ok"],
    ["Gen0 GC", t.gen0Collections, t.gen0Collections > 0 ? "warn" : "ok"],
    ["할당/틱", t.bytesPerTick + " B", t.bytesPerTick > 0 ? "warn" : "ok"],
    ["관리 힙", t.managedHeapMb.toFixed(1) + " MB", grade(t.managedHeapMb, 400)],
  ]);

  rows($("p-npc"), [
    ["총원", n.total],
    ...n.byLod.map((c, i) => [LOD_NAMES[i], bar(c, n.total, String(c))]),
    ...n.byStepStatus
      .map((c, i) => [STEP_STATUS[i], c, i])
      .filter(([, c]) => c > 0)
      .map(([k, c]) => [k, c]),
    ["밴드 이동", n.bandMigrations],
  ]);

  rows($("p-action"), m.actions.length === 0
    ? [["—", "실행 중인 액션 없음"]]
    : m.actions.map((a) => [a.action, bar(a.count, n.total, String(a.count))]));

  rows($("p-link"), [
    ["명령 큐잉", l.commandsEnqueued],
    ["명령 송출", l.commandsFlushed],
    ["명령 드롭", l.commandsDropped, l.commandsDropped > 0 ? "warn" : "ok"],
    ["대기 중", l.pendingCommands],
    ["이벤트 배수", l.eventsDrained],
    ["시퀀스 갭", l.eventGaps, l.eventGaps > 0 ? "bad" : "ok"],
    ["이벤트 적체", l.eventBacklogs, l.eventBacklogs > 0 ? "warn" : "ok"],
  ]);

  rows($("p-replan"), [
    ["큐 깊이", `${r.queueDepth} (p99 ${r.queueDepthP99})`],
    ["초당 유입", r.enqueuedPerSecond.toFixed(2)],
    ["거절", r.queueDropped, r.queueDropped > 0 ? "warn" : "ok"],
    ["인터럽트 슬롯", r.urgentCount + (r.urgentDropped > 0 ? ` (거절 ${r.urgentDropped})` : "")],
    ["낡아서 폐기", r.staleDiscarded, r.staleDiscarded > 0 ? "warn" : "ok"],
    ["인지 스캔/틱", r.scanPerTick, grade(r.scanPerTick, SCAN_BUDGET)],
    ["이탈 판정", r.deviations],
    ["인터럽트 발동", r.interruptsForced],
    ["인터럽트 억제", r.interruptsSuppressed],
    ["LLM 호출", m.llmCalls, m.llmCalls > 0 ? "warn" : "ok"],
  ]);

  renderTiers(r.tiers);
  renderHistogram(r.scoreHistogram, r.queueDepth);
  renderCost(m.cost);
  renderCache(m.cache);
}

// 비용 패널. docs/14 §8 (T4-20).
function renderCost(c) {
  if (!c || !c.enabled) {
    rows($("p-cost"), [["—", "티어 꺼짐 (--tier none) · 런타임 LLM 호출 없음"]]);
    return;
  }

  // ⚠ 로컬 티어는 cached_tokens 를 항상 0 으로 보고한다 (W1_env.md §4.4).
  //    0% 로 그리면 "캐시가 안 걸렸다" 로 읽히므로 "미보고" 로 적는다.
  const cacheCell = c.promptCacheReported
    ? [(100 * c.promptCacheHitRate).toFixed(1) + " %", gradeAtLeast(c.promptCacheHitRate, 0.95)]
    : ["미보고 (로컬 엔진)", "warn"];

  rows($("p-cost"), [
    ["엔진", c.engine],
    ["호출", `${c.calls} (T1 ${c.t1Calls} · T2 ${c.t2Calls})`],
    ["토큰", `입력 ${c.promptTokens.toLocaleString()} · 출력 ${c.completionTokens.toLocaleString()}`],
    ["누적 비용", "$" + c.costUsd.toFixed(4)],
    ["프롬프트 캐시 적중", cacheCell[0], cacheCell[1]],
    // 프리픽스 SHA 가 2종 이상이면 프롬프트 캐시가 깨진 것이다 (docs/01 §10.2 · 리스크 R11).
    ["프리픽스 SHA 종류", c.uniquePrefixHashes, c.uniquePrefixHashes > 1 ? "bad" : "ok"],
    ["일일 토큰 캡", bar(c.tokenCapUsage, 1,
      `${(100 * c.tokenCapUsage).toFixed(1)} % · ${c.tokensToday.toLocaleString()} tok`)],
    ["일일 비용 캡", bar(c.costCapUsage, 1,
      `${(100 * c.costCapUsage).toFixed(1)} % · $${c.costToday.toFixed(4)}`)],
    ["로컬 토큰(캡 밖)", c.localTokensToday.toLocaleString()],
    ["T2→T1 강등", c.downgrades, c.downgrades > 0 ? "warn" : "ok"],
    ["거절", c.rejections, c.rejections > 0 ? "warn" : "ok"],
    ["T2 페일오버", c.failovers, c.failovers > 0 ? "warn" : "ok"],
    ["스필오버", c.spillovers, c.spillovers > 0 ? "warn" : "ok"],
    ["서킷 브레이커", c.breakerState, c.breakerState === "Closed" ? "ok" : "bad"],
  ]);
}

// 티어별 처리율. docs/14 §8 (T4-19).
// 티어가 꺼져 있으면 행이 없다 — 0 으로 채운 행을 그리면 "돌고 있는데 처리량 0" 으로 읽힌다.
function renderTiers(tiers) {
  rows($("p-replan-tier"), !tiers || tiers.length === 0
    ? [["—", "티어 꺼짐 (--tier none)"]]
    : tiers.map((t) => [
        `${t.tier} ${t.source}`,
        `${t.perSecond.toFixed(2)}/s · 워커 ${t.busy}/${t.workers} · 대기 ${t.depth}`
        + ` · 반영 ${t.applied}` + (t.failed > 0 ? ` · 실패 ${t.failed}` : "")
        + (t.avgWaitTicks > 0 ? ` · 대기 ${t.avgWaitTicks}틱` : ""),
        t.failed > t.applied ? "bad" : "ok",
      ]));
}

// 점수 분포. 마지막 칸이 인터럽트(1000+)다.
// 일반 점수 상한은 가중치 합(약 9.5)이라 첫 칸에 몰리는 것이 정상이고, 그 쏠림 자체가 그림이다.
function renderHistogram(buckets, depth) {
  if (!buckets || buckets.length === 0) {
    rows($("p-replan-histogram"), [["—", "대기 중인 요청 없음"]]);
    return;
  }

  const last = buckets.length - 1;
  const step = 1000 / last;
  const peak = Math.max(1, ...buckets);

  rows($("p-replan-histogram"), buckets
    .map((c, i) => [i === last ? "인터럽트 1000+" : `${(i * step).toFixed(0)}~${((i + 1) * step).toFixed(0)}`, c, i])
    .filter(([, c], i) => c > 0 || i === last)
    .map(([k, c]) => [k, bar(c, peak, `${c}${depth > 0 ? ` (${(100 * c / depth).toFixed(0)}%)` : ""}`)]));
}

// 캐시 패널. docs/13 §6 · docs/14 §8 (T4-18).
// 게이트 하한은 히트율 98% 다 — 하한 지표라 grade 가 아니라 gradeAtLeast 를 쓴다.
const CACHE_HIT_FLOOR = 0.98;
const TOTAL_BUCKETS = 2880;   // docs/01 §6

function renderCache(c) {
  spark("p-cache-spark", c.hitRate, CACHE_HIT_FLOOR);

  rows($("p-cache"), [
    ["히트율", (100 * c.hitRate).toFixed(2) + " %", gradeAtLeast(c.hitRate, CACHE_HIT_FLOOR)],
    ["히트 / 미스", `${c.hits} / ${c.misses}`],
    ["채워진 버킷", bar(c.filledBuckets, TOTAL_BUCKETS, `${c.filledBuckets} / ${TOTAL_BUCKETS}`)],
    ["콜드 버킷", c.coldBuckets, c.coldBuckets > 0 ? "warn" : "ok"],
    ["pinned", c.pinnedBuckets],
    ["개별 플랜 살아있음", c.individualLive],
    ["개별 풀 회전율", c.individualTurnover.toFixed(3), grade(c.individualTurnover, 1)],
  ]);

  rows($("p-cache-archetype"), c.worstArchetypes.length === 0
    ? [["—", "조회된 아키타입 없음"]]
    : c.worstArchetypes.map((a) => [
        a.archetype,
        bar(a.hitRate, 1, `${(100 * a.hitRate).toFixed(1)} % · 콜드 ${a.coldBuckets}`),
      ]));
}

async function poll() {
  const state = $("state");

  try {
    const res = await fetch("/metrics", { cache: "no-store" });
    if (!res.ok) { throw new Error("HTTP " + res.status); }

    render(await res.json());
    state.textContent = "live";
    state.className = "live";
  } catch (e) {
    state.textContent = "끊김 — " + e.message;
    state.className = "dead";
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
